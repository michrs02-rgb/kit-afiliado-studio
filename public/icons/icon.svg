<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shopeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b3d" />
      <stop offset="100%" stop-color="#ee4d2d" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4" />

  <!-- Glowing circle behind the bag -->
  <circle cx="256" cy="256" r="140" fill="#ee4d2d" opacity="0.18" filter="url(#glow)" />

  <!-- Shopee Shopping Bag Body -->
  <path d="M140 180 L160 410 C162 426 176 438 192 438 L320 438 C336 438 350 426 352 410 L372 180 Z" fill="url(#shopeeGrad)" />

  <!-- Bag Handles -->
  <path d="M200 180 V135 C200 105 225 80 256 80 C287 80 312 105 312 135 V180" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />

  <!-- Shopee 'S' + Video Play Symbol on bag -->
  <circle cx="256" cy="300" r="54" fill="#0f172a" opacity="0.85" />
  
  <!-- Play Triangle inside circle -->
  <polygon points="244,276 278,300 244,324" fill="#ff7a45" />

  <!-- Sparkles -->
  <path d="M380 120 L390 145 L415 155 L390 165 L380 190 L370 165 L345 155 L370 145 Z" fill="#ffca28" />
  <circle cx="130" cy="140" r="8" fill="#ffca28" opacity="0.8" />
  <circle cx="395" cy="390" r="6" fill="#ff6b3d" opacity="0.7" />
</svg>
